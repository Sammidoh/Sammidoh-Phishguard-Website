{% extends "base.html" %}
{% block content %}
<h2><i class="fas fa-tachometer-alt"></i> Security Dashboard</h2>
<div class="row mt-3" id="statsCards">
    <div class="col-md-4"><div class="card bg-danger text-white"><div class="card-body"><h5><i class="fas fa-ban"></i> Total Blocks</h5><h2 class="display-4" id="totalBlocks">-</h2></div></div></div>
    <div class="col-md-4"><div class="card bg-warning text-dark"><div class="card-body"><h5><i class="fas fa-exclamation-triangle"></i> Bypasses</h5><h2 class="display-4" id="totalBypass">-</h2></div></div></div>
    <div class="col-md-4"><div class="card bg-info text-white"><div class="card-body"><h5><i class="fas fa-link"></i> Blacklisted URLs</h5><h2 class="display-4" id="blacklistCount">-</h2></div></div></div>
</div>

<div class="row mt-4">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">Threat Categories</div>
            <div class="card-body"><canvas id="categoryChart"></canvas></div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">Daily Activity (Last 7 days)</div>
            <div class="card-body"><canvas id="dailyChart"></canvas></div>
        </div>
    </div>
</div>

<div class="card mt-4">
    <div class="card-header"><i class="fas fa-clock"></i> Recent Blocked Attempts</div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-dark table-hover">
                <thead><tr><th>URL</th><th>Category</th><th>Timestamp</th></tr></thead>
                <tbody id="recentLogs"></tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
    async function loadStats() {
        const res = await apiFetch('/logs/stats');
        document.getElementById('totalBlocks').innerText = res.total_blocks || 0;
        document.getElementById('totalBypass').innerText = res.total_bypass || 0;
    }
    async function loadBlacklistCount() {
        const res = await apiFetch('/blacklist/data');
        document.getElementById('blacklistCount').innerText = res.length;
    }
    async function loadRecentLogs() {
        const res = await apiFetch('/logs/data?page=1');
        const tbody = document.getElementById('recentLogs');
        tbody.innerHTML = '';
        (res.logs || []).slice(0,5).forEach(log => {
            tbody.innerHTML += `<tr><td style="word-break:break-all;">${escapeHtml(log.url)}</td><td>${log.threat_category}</td><td>${new Date(log.timestamp).toLocaleString()}</td></tr>`;
        });
    }
    async function loadCharts() {
        const res = await apiFetch('/logs/stats');
        // Category chart: we need category breakdown from backend. For simplicity, we'll simulate or use another endpoint.
        // In a real impl, you'd have a /logs/categories endpoint. Here we'll use a placeholder.
        // Alternatively, you can add a new API endpoint. We'll keep it simple.
        const dummyCategories = ['phishing','malware','scam','fake_banking','fake_login'];
        const dummyCounts = [Math.floor(Math.random()*100), Math.floor(Math.random()*50), 20, 30, 40];
        new Chart(document.getElementById('categoryChart'), {
            type: 'pie', data: { labels: dummyCategories, datasets: [{ data: dummyCounts, backgroundColor: ['#ff6384','#36a2eb','#ffce56','#4bc0c0','#9966ff'] }] }
        });
        // Daily chart
        const daily = res.daily || [];
        new Chart(document.getElementById('dailyChart'), {
            type: 'line', data: { labels: daily.map(d=>d.date), datasets: [{ label: 'Blocks', data: daily.map(d=>d.count), borderColor: '#ff6384', fill: false }] }
        });
    }
    loadStats(); loadBlacklistCount(); loadRecentLogs(); loadCharts();
</script>
{% endblock %}
