{% extends "base.html" %}
{% block content %}
<div class="card">
    <div class="card-header bg-warning text-dark">Edit Whitelisted URL</div>
    <div class="card-body">
        <form method="post" action="{{ url_for('whitelist.update', id=entry.id) }}">
            <div class="mb-3">
                <label class="form-label">URL</label>
                <input type="url" name="url" class="form-control" value="{{ entry.url }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Reason</label>
                <input type="text" name="reason" class="form-control" value="{{ entry.reason }}">
            </div>
            <button type="submit" class="btn btn-primary">Update</button>
            <a href="{{ url_for('whitelist.list_whitelist') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
