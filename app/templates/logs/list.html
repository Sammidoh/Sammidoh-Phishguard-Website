{% extends "base.html" %}
{% block content %}
<h2><i class="fas fa-history"></i> Blocked Attempts Logs</h2>
<div class="card">
    <div class="card-body">
        <div class="row mb-3">
            <div class="col-md-3"><select id="catFilter" class="form-select"><option value="">All Categories</option><option>phishing</option><option>malware</option><option>scam</option><option>fake_banking</option><option>fake_login</option></select></div>
            <div class="col-md-3"><input type="text" id="searchInput" class="form-control" placeholder="Search URL/IP"></div>
            <div class="col-md-2"><button id="refreshBtn" class="btn btn-primary">Refresh</button></div>
        </div>
        <div class="table-responsive">
            <table class="table table-dark table-hover">
                <thead><tr><th>Timestamp</th><th>URL</th><th>Category</th><th>Action</th><th>IP</th><th>Risk</th></tr></thead>
                <tbody id="logTableBody"></tbody>
            </table>
        </div>
        <div id="pagination" class="mt-3"></div>
    </div>
</div>
<script>
    let currentPage = 1;
    async function loadLogs() {
        const cat = document.getElementById('catFilter').value;
        const search = document.getElementById('searchInput').value;
        let url = `/logs/data?page=${currentPage}`;
        if (cat) url += `&category=${cat}`;
        const res = await apiFetch(url);
        const tbody = document.getElementById('logTableBody');
        tbody.innerHTML = '';
        res.logs.forEach(l => {
            tbody.innerHTML += `<tr><td>${new Date(l.timestamp).toLocaleString()}</td><td style="word-break:break-all;">${escapeHtml(l.url)}</td><td>${l.threat_category}</td><td>${l.user_action}</td><td>${l.ip_address}</td><td>${l.risk_score}</td></tr>`;
        });
        let pagHtml = `<nav><ul class="pagination">`;
        for (let i=1; i<=res.pages; i++) {
            pagHtml += `<li class="page-item ${i===currentPage?'active':''}"><a class="page-link" href="#" onclick="changePage(${i});return false;">${i}</a></li>`;
        }
        pagHtml += `</ul></nav>`;
        document.getElementById('pagination').innerHTML = pagHtml;
    }
    window.changePage = (p) => { currentPage = p; loadLogs(); };
    document.getElementById('catFilter').addEventListener('change', () => { currentPage=1; loadLogs(); });
    document.getElementById('searchInput').addEventListener('input', () => { currentPage=1; loadLogs(); });
    document.getElementById('refreshBtn').addEventListener('click', loadLogs);
    loadLogs();
</script>
{% endblock %}
